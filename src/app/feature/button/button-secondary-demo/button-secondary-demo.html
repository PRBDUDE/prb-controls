<jelly-container>
  <card-container>
    <card-header>Large Secondary Button</card-header>
    <card-body>
      <p>
        This demonstrates the Large Secondary button.
      </p>
      <div>
        <button-secondary (click)="onSecondaryLargeClick($event)">Large</button-secondary>
        <button-secondary [pill]="true" (click)="onSecondaryLargeClick($event)">Large</button-secondary>
      </div>
    </card-body>
  </card-container>
  <card-container>
    <card-header>Medium Secondary Button</card-header>
    <card-body>
      <p>
        This demonstrates the Medium Secondary Button.
      </p>
      <div>
        <button-secondary [size]="'medium'" (click)="onSecondaryMediumClick($event)">Medium</button-secondary>
        <button-secondary [size]="'medium'" [pill]="true" (click)="onSecondaryMediumClick($event)">Medium
        </button-secondary>
      </div>
    </card-body>
  </card-container>
  <card-container>
    <card-header>Small Secondary Button</card-header>
    <card-body>
      <p>
        This demonstrates the Small Secondary button.
      </p>
      <div>
        <button-secondary [size]="'small'" (click)="onSecondarySmallClick($event)">Small</button-secondary>
        <button-secondary [size]="'small'" [pill]="true" (click)="onSecondarySmallClick($event)">Small</button-secondary>
      </div>
    </card-body>
  </card-container>
</jelly-container>
