<jelly-container>
  <card-container>
    <card-header>Secondary Button</card-header>
    <card-body>
      <p>
        This demonstrates the {{ size() | titlecase }} Secondary button.
      </p>
      <div>
        <html-tag>&lt;</html-tag>
        <user-tag>button-secondary</user-tag>
      </div>
      <indent-1>
        <html-attribute>[size]</html-attribute><prb-string>="{{ size() }}"</prb-string>
      </indent-1>
      <indent-1>
        <html-attribute>[pill]</html-attribute><prb-string>="{{ pill() }}"</prb-string>
      </indent-1>
      <indent-1>
        <html-attribute>(click)</html-attribute><prb-string>="</prb-string><method-name>onSecondaryClick</method-name>()
        <prb-string>"</prb-string>
      </indent-1>
      <indent-1>
      </indent-1>
      <div><html-tag>&gt;</html-tag>{{ size() | titlecase }}<html-tag>&lt;/</html-tag>
        <user-tag>button-secondary</user-tag>
        <html-tag>&gt;</html-tag>
      </div>

      <p>
        Button size
      </p>
      <radio-group
        [options]="sizeOptions"
        [name]="'sizeControl'"
        [orientation]="'horizontal'"
        [(ngModel)]="size"
      />
      <br />

      <slide-switch
        [(ngModel)]="pill"
        [label]="'pill'"
      />
    </card-body>
  </card-container>
  <div>
    <button-secondary [size]="size()" [pill]="pill()"
                      (click)="onSecondaryClick($event)">Large</button-secondary>
  </div>
</jelly-container>
