<jelly-container>
  <card-container>
    <card-header>Large Tertiary Button</card-header>
    <card-body>
      <p>
        This demonstrates the Large Tertiary button.
      </p>
      <div>
        <button-tertiary (click)="onTertiaryLargeClick($event)">Large</button-tertiary>
        <button-tertiary [pill]="true" (click)="onTertiaryLargeClick($event)">Large</button-tertiary>
      </div>
    </card-body>
  </card-container>
  <card-container>
    <card-header>Medium Tertiary Button</card-header>
    <card-body>
      <p>
        This demonstrates the Medium Tertiary button.
      </p>
      <div>
        <button-tertiary [size]="'medium'" (click)="onTertiaryMediumClick($event)">Medium</button-tertiary>
        <button-tertiary [size]="'medium'" [pill]="true" (click)="onTertiaryMediumClick($event)">Medium</button-tertiary>
      </div>
    </card-body>
  </card-container>
  <card-container>
    <card-header>Small Tertiary Button</card-header>
    <card-body>
      <p>
        This demonstrates the Small Tertiary button.
      </p>
      <div>
        <button-tertiary [size]="'small'" (click)="onTertiarySmallClick($event)">Small</button-tertiary>
        <button-tertiary [size]="'small'" [pill]="true" (click)="onTertiarySmallClick($event)">Small</button-tertiary>
      </div>
    </card-body>
  </card-container>
</jelly-container>
