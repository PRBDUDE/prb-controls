<jelly-container>
  Here are the AI prompts used to generate the light-chaser control
  <ul>
    <li>
      angular 22
    </li>
    <li>
      create a light chaser control to show activity
    </li>
    <li>
      using input signals
    </li>
  </ul>
  <card-container>
    <card-header>Light Chaser</card-header>
    <card-body>
      <div class="controls">
        <slide-switch [(ngModel)]="isProcessing" [label]="'Processing'" />
      </div>
    </card-body>
  </card-container>

  <h1>Activity Monitor</h1>

  <hr>

  <h1>Fast</h1>
  <prb-light-chaser
    [active]="isProcessing()"
    [count]="10"
    [speed]="90"
    activeColor="#ff3366" />

  <h1>Slow (display activity)</h1>
  <prb-light-chaser
    [active]="isProcessing()"
    [count]="6"
    [speed]="180"
    [displayActivity]="true" />
</jelly-container>
